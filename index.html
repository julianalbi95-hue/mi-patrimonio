<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173c34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Patrimonio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mi Patrimonio</title>
<style>
:root{--green:#173c34;--mint:#dcefe7;--bg:#f4f6f5;--card:#fff;--ink:#17211e;--muted:#68756f;--red:#b44343;--line:#e5eae7;--blue:#4787bd;--orange:#d69a43;--purple:#9274bb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
header{background:var(--green);color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:5}.top{display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}header small{opacity:.75}
main{max-width:760px;margin:auto;padding:16px}.panel{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #14271c0a}.hero{background:var(--green);color:white}.hero small{opacity:.75}.big{font-size:30px;font-weight:750;margin:7px 0}.muted{color:var(--muted)}.hero .muted{color:#d2e0da}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7f9f8;border-radius:13px;padding:12px}.metric b{display:block;font-size:19px;margin-top:5px}
h2{font-size:18px;margin:4px 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row strong{display:block}.row small{color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{border:0;background:none;color:var(--muted);font-size:11px;padding:5px 7px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button.active{color:var(--green);font-weight:700}nav span{font-size:19px}
button,.btn{border:0;border-radius:12px;background:var(--green);color:white;padding:12px 14px;font-weight:650;font-size:14px;cursor:pointer}.secondary{background:var(--mint);color:var(--green)}.danger{background:#fae8e8;color:var(--red)}.smallbtn{padding:7px 10px;font-size:12px}
input,select{width:100%;padding:12px;border:1px solid #d8e0dc;border-radius:11px;background:white;font:inherit;color:var(--ink);margin:5px 0 12px}label{font-size:13px;font-weight:650;color:#46534d}form{margin-top:10px}
.tag{font-size:11px;border-radius:20px;background:#edf3f0;padding:4px 8px;color:var(--green)}.amount-in{color:#16804f}.amount-out{color:var(--red)}.empty{text-align:center;padding:24px;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.45}.hidden{display:none!important}
.bar{height:10px;background:#e8eeeb;border-radius:99px;overflow:hidden;flex:1}.bar i{display:block;height:100%;border-radius:99px}.statline{display:flex;align-items:center;gap:9px;margin:12px 0}.statline .name{width:105px;font-size:13px;overflow-wrap:anywhere}.statline .value{width:82px;text-align:right;font-size:13px;font-weight:650}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}.pillactive{background:var(--green);color:#fff}.pillidle{background:var(--mint);color:var(--green)}
</style>
</head>
<body>
<header><div class="top"><div><h1>Mi Patrimonio</h1><small>Tu centro de control financiero</small></div><div>💶</div></div></header>
<main id="app"></main>
<nav>
<button data-tab="home" class="active"><span>⌂</span>Inicio</button>
<button data-tab="moves"><span>↕</span>Movimientos</button>
<button data-tab="accounts"><span>▤</span>Cuentas</button>
<button data-tab="expiries"><span>◷</span>Vencimientos</button>
<button data-tab="goals"><span>◎</span>Objetivos</button>
<button data-tab="stats"><span>▥</span>Análisis</button>
</nav>
<script>
const KEY='miPatrimonio_v1';
const initial={accounts:[
{id:1,name:'Trade Republic · Ahorro',type:'Ahorro',group:'personal',balance:7800},
{id:2,name:'Revolut · Cuenta conjunta',type:'Ahorro',group:'conjunta',balance:1800},
{id:3,name:'imaginBank · Personal',type:'Cuenta',group:'personal',balance:0},
{id:4,name:'imaginBank · Casa',type:'Cuenta',group:'conjunta',balance:0},
{id:5,name:'Fondo S&P 500',type:'Inversión',group:'personal',balance:2580},
{id:6,name:'Criptomonedas',type:'Inversión',group:'personal',balance:0}],
moves:[],expiries:[],subscriptions:[],goals:[{id:1,name:'Colchón de seguridad',target:20000,current:0}],budgets:[],incomeTarget:3670};
function migrate(raw){
const d=raw&&typeof raw==='object'?raw:structuredClone(initial);
d.accounts=Array.isArray(d.accounts)?d.accounts:[];
d.moves=Array.isArray(d.moves)?d.moves:[];
d.goals=Array.isArray(d.goals)?d.goals:[];
d.expiries=Array.isArray(d.expiries)?d.expiries:[];
d.subscriptions=Array.isArray(d.subscriptions)?d.subscriptions:[];
d.accounts.forEach(a=>{if(!a.group)a.group=/conjunta|casa|revolut/i.test(a.name)?'conjunta':'personal'});
d.moves.forEach(m=>{
if(!m.group){const a=d.accounts.find(x=>x.id===m.account);m.group=a?.group||'personal'}
if(!m.date)m.date=new Date().toLocaleDateString('es-ES');
if(!m.month){const p=m.date.split('/');m.month=p.length===3?p[2]+'-'+p[1].padStart(2,'0'):new Date().toISOString().slice(0,7)}
});
return d;
}
let data;try{data=migrate(JSON.parse(localStorage.getItem(KEY))||structuredClone(initial))}catch{data=structuredClone(initial)}
let tab='home',statsGroup='all';
const eur=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const total=()=>data.accounts.reduce((s,a)=>s+Number(a.balance||0),0);
const groupTotal=g=>data.accounts.filter(a=>a.group===g).reduce((s,a)=>s+Number(a.balance||0),0);
const sumType=t=>data.accounts.filter(a=>a.type===t).reduce((s,a)=>s+Number(a.balance||0),0);
const currentMonth=()=>new Date().toISOString().slice(0,7);
const monthMoves=(g='all',month=currentMonth())=>data.moves.filter(m=>m.month===month&&(g==='all'||(m.group||'personal')===g));
const sums=(g='all',month=currentMonth())=>{let ms=monthMoves(g,month);return {in:ms.filter(m=>m.kind==='Ingreso').reduce((s,m)=>s+Number(m.amount),0),out:ms.filter(m=>m.kind==='Gasto').reduce((s,m)=>s+Number(m.amount),0)}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groupName=g=>g==='conjunta'?'Conjunta':'Personal';
function goalMarkup(g){if(!g)return 'Aún no tienes objetivos.';return '<strong>'+esc(g.name)+'</strong><div class="big" style="font-size:24px">'+eur(g.current)+' / '+eur(g.target)+'</div><div class="bar"><i style="width:'+Math.min(100,g.current/Math.max(1,g.target)*100)+'%;background:#26966b"></i></div>'}
function localISO(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function addOneMonth(date){const [y,m,day]=date.split('-').map(Number);const nextMonth=m===12?1:m+1,nextYear=m===12?y+1:y;const lastDay=new Date(nextYear,nextMonth,0).getDate();return nextYear+'-'+String(nextMonth).padStart(2,'0')+'-'+String(Math.min(day,lastDay)).padStart(2,'0')}
function processDueSubscriptions(){
const today=localISO();let changed=false;
data.subscriptions.filter(s=>s.active!==false).forEach(s=>{
if(!s.nextDate||!s.account)return;
let guard=0;
while(s.nextDate<=today&&guard++<120){
const a=data.accounts.find(x=>x.id===Number(s.account));if(!a)break;
const date=s.nextDate,amount=Number(s.amount)||0,month=date.slice(0,7);
a.balance=Number(a.balance||0)-amount;
data.moves.push({id:Date.now()+data.moves.length,name:s.name,amount,kind:'Gasto',category:s.category||'Suscripciones',account:a.id,group:a.group||'personal',date:new Date(date+'T12:00:00').toLocaleDateString('es-ES'),month,subscriptionId:s.id});
s.nextDate=addOneMonth(s.nextDate);changed=true;
}
});
if(changed)save();
}
function categoryStats(moves){
const map={};moves.filter(m=>m.kind==='Gasto').forEach(m=>map[m.category]=(map[m.category]||0)+Number(m.amount));
return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function render(){
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
const app=document.getElementById('app');
if(tab==='home'){
const s=sums(),sp=sums('personal'),sc=sums('conjunta');
app.innerHTML='<section class="panel hero"><small>Patrimonio total</small><div class="big">'+eur(total())+'</div><div class="muted">Todo tu dinero: ahorro, cuentas e inversiones</div></section>'+
'<section class="panel"><h2>Mi patrimonio personal</h2><div class="big" style="font-size:26px">'+eur(groupTotal('personal'))+'</div><div class="row"><div><strong>Mi ahorro personal</strong><small>Cuentas y depósitos de ahorro</small></div><b>'+eur(data.accounts.filter(a=>a.group==='personal'&&a.type==='Ahorro').reduce((n,a)=>n+Number(a.balance||0),0))+'</b></div><div class="row"><div><strong>Mi cuenta de gastos</strong><small>Dinero disponible para gastos personales</small></div><b>'+eur(data.accounts.filter(a=>a.group==='personal'&&a.type==='Cuenta').reduce((n,a)=>n+Number(a.balance||0),0))+'</b></div><div class="row"><div><strong>Mis inversiones</strong><small>Fondos, ETF, acciones y criptomonedas</small></div><b>'+eur(data.accounts.filter(a=>a.group==='personal'&&a.type==='Inversión').reduce((n,a)=>n+Number(a.balance||0),0))+'</b></div><div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><div class="row" style="padding-top:0"><div><strong>Mis suscripciones</strong><small>Gasto recurrente personal al mes</small></div><b>'+eur(data.subscriptions.filter(s=>s.active!==false&&data.accounts.find(a=>a.id===Number(s.account))?.group==='personal').reduce((n,s)=>n+Number(s.amount||0),0))+'/mes</b></div>'+ (data.subscriptions.filter(s=>s.active!==false&&data.accounts.find(a=>a.id===Number(s.account))?.group==='personal').length?data.subscriptions.filter(s=>s.active!==false&&data.accounts.find(a=>a.id===Number(s.account))?.group==='personal').map(s=>'<div class="row"><div><strong>'+esc(s.name)+'</strong><small>Próximo cobro: '+new Date(s.nextDate+'T12:00:00').toLocaleDateString('es-ES')+'</small></div><b>'+eur(s.amount)+'</b></div>').join(''):'<small class="muted">Todavía no tienes suscripciones personales activas.</small>')+'</div><button class="secondary smallbtn" style="margin-top:12px" data-goto-subscriptions>Gestionar suscripciones</button></section>'+
'<section class="panel"><h2>Patrimonio conjunto</h2><div class="big" style="font-size:26px">'+eur(groupTotal('conjunta'))+'</div><div class="row"><div><strong>Ahorro conjunto</strong><small>Ahorro compartido</small></div><b>'+eur(data.accounts.filter(a=>a.group==='conjunta'&&a.type==='Ahorro').reduce((n,a)=>n+Number(a.balance||0),0))+'</b></div><div class="row"><div><strong>Cuenta de gastos conjunta</strong><small>Dinero disponible para gastos de casa</small></div><b>'+eur(data.accounts.filter(a=>a.group==='conjunta'&&a.type==='Cuenta').reduce((n,a)=>n+Number(a.balance||0),0))+'</b></div></section>'+
'<section class="grid"><div class="panel metric"><small class="muted">Ingresos este mes</small><b class="amount-in">'+eur(s.in)+'</b></div><div class="panel metric"><small class="muted">Gastos este mes</small><b class="amount-out">'+eur(s.out)+'</b></div></section>'+
'<section class="panel"><h2>Ahorro registrado este mes</h2><div class="big" style="font-size:25px">'+eur(s.in-s.out)+'</div><div class="row"><span>Personal</span><b>'+eur(sp.in-sp.out)+'</b></div><div class="row"><span>Conjunta</span><b>'+eur(sc.in-sc.out)+'</b></div><small class="muted">Calculado con los ingresos y gastos que registres.</small></section>'+
'<section class="panel"><h2>Mis cuentas</h2>'+data.accounts.map(a=>'<div class="row"><div><strong>'+esc(a.name)+'</strong><small>'+groupName(a.group)+' · '+esc(a.type)+'</small></div><b>'+eur(a.balance)+'</b></div>').join('')+'</section>'+
'<section class="panel"><h2>Objetivo principal</h2>'+goalMarkup(data.goals[0])+'</section>';
}else if(tab==='moves'){
const accts=data.accounts;
const activeSubs=data.subscriptions.filter(s=>s.active!==false);
app.innerHTML='<section class="panel"><h2>Suscripciones mensuales</h2><p class="note">Añade Netflix, Spotify, gimnasio, etc. La app registrará el gasto y descontará el saldo de la cuenta elegida al llegar la fecha de cobro.</p>'+
(activeSubs.length?activeSubs.map(s=>{const a=data.accounts.find(x=>x.id===Number(s.account));return '<div class="row"><div style="min-width:0;flex:1"><strong>'+esc(s.name)+'</strong><small>'+eur(s.amount)+' al mes · '+esc(a?.name||'Cuenta no encontrada')+'</small><div style="margin-top:5px"><span class="tag">Próximo cobro: '+new Date(s.nextDate+'T12:00:00').toLocaleDateString('es-ES')+'</span></div></div><button class="smallbtn danger" data-sub-cancel="'+s.id+'">Cancelar</button></div>'}).join(''):'<div class="empty">Todavía no tienes suscripciones activas.</div>')+
'<form id="subForm"><h2 style="margin-top:18px">Añadir suscripción</h2><label>Nombre</label><input name="name" placeholder="Ej. Netflix" required><label>Importe mensual (€)</label><input name="amount" type="number" min="0.01" step="0.01" placeholder="8.99" required><label>Categoría</label><select name="category"><option>Suscripciones</option><option>Ocio</option><option>Deporte</option><option>Otros</option></select><label>Cuenta desde la que se cobra</label><select name="account">'+data.accounts.filter(a=>a.type==='Cuenta'||a.type==='Ahorro').map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('')+'</select><label>Fecha del primer / próximo cobro</label><input name="nextDate" type="date" value="'+localISO()+'" required><button style="width:100%">Añadir suscripción</button></form></section>'+
'<section class="panel"><h2>Registrar movimiento</h2><form id="moveForm">'+
'<label>Tipo</label><select name="kind"><option>Gasto</option><option>Ingreso</option><option>Transferencia</option></select>'+
'<label>Concepto</label><input name="name" placeholder="Ej. Compra supermercado" required>'+
'<label>Importe (€)</label><input name="amount" type="number" min="0.01" step="0.01" required>'+
'<label>Categoría</label><select name="category">'+['Alimentación','Vivienda','Transporte','Ocio','Restaurantes','Compras','Suministros','Salud','Suscripciones','Viajes','Nómina','Ahorro','Inversiones','Otros'].map(x=>'<option>'+x+'</option>').join('')+'</select>'+
'<label>Cuenta</label><select name="group" id="moveGroup"><option value="personal">Personal</option><option value="conjunta">Conjunta</option></select>'+
'<label>Cuenta bancaria o activo</label><select name="account" id="moveAccount">'+accts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('')+'</select>'+
'<div id="transferToWrap" class="hidden"><label>Cuenta de destino</label><select name="toAccount" id="toAccount">'+accts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('')+'</select></div>'+
'<label>Fecha</label><input name="date" type="date" value="'+new Date().toISOString().slice(0,10)+'" required>'+
'<button style="width:100%">Guardar movimiento</button></form></section>'+
'<section class="panel"><h2>Historial de movimientos</h2><div class="tabs"><button class="pillactive" data-filter="all">Todos</button><button class="pillidle" data-filter="personal">Personal</button><button class="pillidle" data-filter="conjunta">Conjunta</button></div><div id="history">'+historyMarkup('all')+'</div></section>';
document.getElementById('subForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),a=data.accounts.find(x=>x.id===Number(f.get('account'))),amount=Number(f.get('amount')),nextDate=f.get('nextDate');if(!a||!amount||amount<=0||!nextDate)return;data.subscriptions.push({id:Date.now(),name:f.get('name').trim(),amount,category:f.get('category'),account:a.id,nextDate,active:true});processDueSubscriptions();save();render()};
document.querySelectorAll('[data-sub-cancel]').forEach(b=>b.onclick=()=>{const s=data.subscriptions.find(x=>x.id===Number(b.dataset.subCancel));if(s&&confirm('¿Cancelar '+s.name+'? No se generarán más cargos automáticos.')){s.active=false;save();render()}});
const f=document.getElementById('moveForm'),group=document.getElementById('moveGroup'),account=document.getElementById('moveAccount'),to=document.getElementById('toAccount');
function filterAccounts(){const list=accts.filter(a=>a.group===group.value);account.innerHTML=list.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('');to.innerHTML=accts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('')}
group.addEventListener('change',filterAccounts);f.kind.addEventListener('change',()=>document.getElementById('transferToWrap').classList.toggle('hidden',f.kind.value!=='Transferencia'));
f.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(f),amt=Number(fd.get('amount')),kind=fd.get('kind'),g=fd.get('group'),a=data.accounts.find(x=>x.id===Number(fd.get('account'))),dest=data.accounts.find(x=>x.id===Number(fd.get('toAccount')));if(!a||!amt||amt<=0)return;if(kind==='Transferencia'){if(!dest||dest.id===a.id)return alert('Elige una cuenta de destino diferente.');a.balance-=amt;dest.balance+=amt}else if(kind==='Gasto')a.balance-=amt;else a.balance+=amt;
const date=fd.get('date'),month=date.slice(0,7);data.moves.push({id:Date.now(),name:fd.get('name').trim(),amount:amt,kind,category:fd.get('category'),account:a.id,toAccount:kind==='Transferencia'?dest.id:null,group:g,date:new Date(date+'T12:00:00').toLocaleDateString('es-ES'),month});save();render()});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>{x.className=x===b?'pillactive':'pillidle'});document.getElementById('history').innerHTML=historyMarkup(b.dataset.filter);wireHistory()});wireHistory();
}else if(tab==='accounts'){
app.innerHTML='<section class="panel"><h2>Cuentas personales y conjuntas</h2><p class="note">Asigna cada cuenta a Personal o Conjunta. Los saldos existentes se conservan.</p>'+data.accounts.map(a=>'<div class="row"><div style="flex:1"><strong>'+esc(a.name)+'</strong><small>'+esc(a.type)+' · '+groupName(a.group)+'</small></div><div style="width:112px"><input aria-label="Saldo '+esc(a.name)+'" type="number" step=".01" data-balance="'+a.id+'" value="'+a.balance+'" style="margin:0"></div></div>').join('')+'</section>'+
'<section class="panel"><h2>Añadir cuenta</h2><form id="accountForm"><label>Nombre</label><input name="name" placeholder="Ej. Cuenta nómina" required><label>Tipo</label><select name="type"><option>Cuenta</option><option>Ahorro</option><option>Inversión</option><option>Deuda</option></select><label>Grupo</label><select name="group"><option value="personal">Personal</option><option value="conjunta">Conjunta</option></select><label>Saldo actual (€)</label><input name="balance" type="number" step=".01" value="0"><button style="width:100%">Añadir cuenta</button></form></section>'+
'<section class="grid"><div class="panel metric"><small>Personal</small><b>'+eur(groupTotal('personal'))+'</b></div><div class="panel metric"><small>Conjunta</small><b>'+eur(groupTotal('conjunta'))+'</b></div></section>';
document.querySelectorAll('[data-balance]').forEach(i=>i.onchange=()=>{let a=data.accounts.find(x=>x.id===Number(i.dataset.balance));a.balance=Number(i.value)||0;save();render()});
document.getElementById('accountForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.accounts.push({id:Date.now(),name:f.get('name'),type:f.get('type'),group:f.get('group'),balance:Number(f.get('balance'))||0});save();render()};
}else if(tab==='expiries'){
const today=new Date();today.setHours(0,0,0,0);
const sorted=data.expiries.slice().sort((a,b)=>a.date.localeCompare(b.date));
const daysLeft=date=>Math.ceil((new Date(date+'T00:00:00')-today)/86400000);
const status=e=>{const d=daysLeft(e.date);return d<0?'<span class="tag" style="background:#fae8e8;color:#b44343">Vencido hace '+Math.abs(d)+' días</span>':d===0?'<span class="tag" style="background:#fae8e8;color:#b44343">Vence hoy</span>':d<=30?'<span class="tag" style="background:#fff1d9;color:#8a5b13">En '+d+' días</span>':'<span class="tag">En '+d+' días</span>'};
app.innerHTML='<section class="panel"><h2>Documentos y vencimientos</h2><p class="note">Ten localizados tus documentos, pólizas y renovaciones. Los más próximos aparecen primero.</p>'+ (sorted.length?sorted.map(e=>'<div class="row" style="align-items:flex-start"><div style="min-width:0;flex:1"><strong>'+esc(e.name)+'</strong><small>'+esc(e.category)+(e.notes?' · '+esc(e.notes):'')+'</small><div style="margin-top:7px">'+status(e)+'</div></div><div style="text-align:right;white-space:nowrap"><b>'+new Date(e.date+'T12:00:00').toLocaleDateString('es-ES')+'</b><div style="margin-top:7px"><button class="smallbtn secondary" data-expiry-edit="'+e.id+'">Editar</button> <button class="smallbtn danger" data-expiry-delete="'+e.id+'">Borrar</button></div></div></div>').join(''):'<div class="empty">Todavía no has añadido documentos o vencimientos.</div>')+'</section>'+
'<section class="panel"><h2>Añadir documento o vencimiento</h2><form id="expiryForm"><label>Nombre</label><input name="name" placeholder="Ej. Seguro del coche" required><label>Tipo</label><select name="category">'+['DNI','Pasaporte','Carnet de conducir','Seguro de coche','Seguro de hogar','Seguro de vida','ITV','Impuesto de circulación','Hipoteca / préstamo','Suscripción','Garantía','Otro'].map(x=>'<option>'+x+'</option>').join('')+'</select><label>Fecha de vencimiento o renovación</label><input name="date" type="date" required><label>Notas (opcional)</label><input name="notes" placeholder="Ej. Compañía, número de póliza..."><button style="width:100%">Guardar vencimiento</button></form></section>'+
'<section class="panel"><p class="note">Aviso: esta sección muestra los días que faltan cuando abres la aplicación. Todavía no envía notificaciones automáticas ni avisos cuando la app está cerrada.</p></section>';
document.getElementById('expiryForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.expiries.push({id:Date.now(),name:f.get('name').trim(),category:f.get('category'),date:f.get('date'),notes:f.get('notes').trim()});save();render()};
document.querySelectorAll('[data-expiry-delete]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este vencimiento?')){data.expiries=data.expiries.filter(x=>x.id!==Number(b.dataset.expiryDelete));save();render()}});
document.querySelectorAll('[data-expiry-edit]').forEach(b=>b.onclick=()=>{const x=data.expiries.find(v=>v.id===Number(b.dataset.expiryEdit));if(!x)return;const name=prompt('Nombre',x.name);if(name===null)return;const date=prompt('Fecha (AAAA-MM-DD)',x.date);if(date===null)return;const notes=prompt('Notas',x.notes||'');if(notes===null)return;if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(date)){alert('Introduce la fecha con formato AAAA-MM-DD.');return}x.name=name.trim()||x.name;x.date=date;x.notes=notes.trim();save();render()});
}else if(tab==='goals'){
app.innerHTML='<section class="panel"><h2>Mis objetivos de ahorro</h2>'+data.goals.map(g=>'<div style="margin:14px 0"><strong>'+esc(g.name)+'</strong><div class="big" style="font-size:24px">'+eur(g.current)+' <small class="muted" style="font-size:14px">/ '+eur(g.target)+'</small></div><div class="bar"><i style="width:'+Math.min(100,g.current/Math.max(1,g.target)*100)+'%;background:#26966b"></i></div><small class="muted">'+Math.round(Math.min(100,g.current/Math.max(1,g.target)*100))+'% completado · Faltan '+eur(Math.max(0,g.target-g.current))+'</small><div style="display:flex;gap:8px;margin-top:8px"><button class="secondary smallbtn" data-goal-edit="'+g.id+'">Editar</button><button class="danger smallbtn" data-goal-delete="'+g.id+'">Eliminar</button></div></div>').join('')||'<div class="empty">Crea un objetivo de ahorro.</div>'+'</section>'+
'<section class="panel"><h2>Crear objetivo</h2><form id="goalForm"><label>Nombre</label><input name="name" required><label>Importe objetivo (€)</label><input name="target" type="number" min="1" required><label>Ahorrado actualmente (€)</label><input name="current" type="number" min="0" value="0"><button style="width:100%">Crear objetivo</button></form></section>';
document.getElementById('goalForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.goals.push({id:Date.now(),name:f.get('name'),target:Number(f.get('target')),current:Number(f.get('current'))||0});save();render()};
document.querySelectorAll('[data-goal-edit]').forEach(b=>b.onclick=()=>{let g=data.goals.find(x=>x.id===Number(b.dataset.goalEdit)),n=prompt('Nombre',g.name),t=prompt('Objetivo en euros',g.target),c=prompt('Cantidad acumulada',g.current);if(n===null||t===null||c===null)return;g.name=n;g.target=Number(t)||g.target;g.current=Number(c)||0;save();render()});
}else{
const s=sums(statsGroup),sp=sums('personal'),sc=sums('conjunta'),moves=monthMoves(statsGroup),cats=categoryStats(moves),max=Math.max(1,...cats.map(x=>x[1]));
const colors=['#3985d6','#16a085','#e5a13b','#9b79c9','#d66b6b','#5c9d91','#778899'];
const months=Array.from({length:6},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));return d.toISOString().slice(0,7)});
const monthData=months.map(m=>({m, ...sums(statsGroup,m)}));
app.innerHTML='<section class="panel"><h2>Análisis de gastos y ahorro</h2><div class="tabs"><button class="'+(statsGroup==='all'?'pillactive':'pillidle')+'" data-sgroup="all">Global</button><button class="'+(statsGroup==='personal'?'pillactive':'pillidle')+'" data-sgroup="personal">Personal</button><button class="'+(statsGroup==='conjunta'?'pillactive':'pillidle')+'" data-sgroup="conjunta">Conjunta</button></div><div class="grid"><div class="metric"><small>Ingresos del mes</small><b class="amount-in">'+eur(s.in)+'</b></div><div class="metric"><small>Gastos del mes</small><b class="amount-out">'+eur(s.out)+'</b></div></div><div class="big" style="font-size:25px;margin-top:14px">Ahorro: '+eur(s.in-s.out)+'</div><small class="muted">Solo movimientos registrados en el mes actual.</small></section>'+
'<section class="panel"><h2>¿En qué gasto?</h2>'+(cats.length?cats.map(([name,value],i)=>'<div class="statline"><div class="name">'+esc(name)+'</div><div class="bar"><i style="width:'+(value/max*100)+'%;background:'+colors[i%colors.length]+'"></i></div><div class="value">'+eur(value)+'</div></div>').join(''):'<div class="empty">Registra gastos para ver su distribución por categoría.</div>')+'</section>'+
'<section class="panel"><h2>Ingresos, gastos y ahorro · últimos 6 meses</h2>'+monthData.map(x=>'<div style="margin:14px 0"><div class="row"><strong>'+esc(x.m)+'</strong><b class="'+(x.in-x.out>=0?'amount-in':'amount-out')+'">'+eur(x.in-x.out)+'</b></div><div class="statline"><div class="name">Ingresos</div><div class="bar"><i style="width:'+(x.in/Math.max(1,...monthData.map(y=>y.in))*100)+'%;background:#26966b"></i></div><div class="value">'+eur(x.in)+'</div></div><div class="statline"><div class="name">Gastos</div><div class="bar"><i style="width:'+(x.out/Math.max(1,...monthData.map(y=>y.out))*100)+'%;background:#c65b5b"></i></div><div class="value">'+eur(x.out)+'</div></div></div>').join('')+'</section>'+
'<section class="panel"><h2>Comparación de cuentas</h2><div class="row"><span>Ahorro personal del mes</span><b>'+eur(sp.in-sp.out)+'</b></div><div class="row"><span>Ahorro conjunto del mes</span><b>'+eur(sc.in-sc.out)+'</b></div><div class="row"><span>Patrimonio personal</span><b>'+eur(groupTotal('personal'))+'</b></div><div class="row"><span>Patrimonio conjunto</span><b>'+eur(groupTotal('conjunta'))+'</b></div></section>'+
'<section class="panel"><h2>Copias de seguridad</h2><p class="note">Descarga regularmente una copia de tus cuentas y movimientos. Los datos se guardan en este navegador y no se sincronizan automáticamente entre dispositivos.</p><button id="export" style="width:100%">Exportar copia de seguridad</button><label style="display:block;margin-top:14px">Importar copia</label><input type="file" id="import" accept=".json,application/json"></section>';
document.querySelectorAll('[data-sgroup]').forEach(b=>b.onclick=()=>{statsGroup=b.dataset.sgroup;render()});
document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mi-patrimonio-copia.json';a.click();URL.revokeObjectURL(url)};
document.getElementById('import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const obj=JSON.parse(await file.text());if(!obj.accounts||!obj.moves)throw Error();data=migrate(obj);save();render();alert('Copia restaurada correctamente.')}catch{alert('No se ha podido importar ese archivo.')}};
}
document.querySelectorAll('[data-goal-delete]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar objetivo?')){data.goals=data.goals.filter(g=>g.id!==Number(b.dataset.goalDelete));save();render()}});
}
function historyMarkup(filter){const list=data.moves.slice().reverse().filter(m=>filter==='all'||(m.group||'personal')===filter);return list.map(m=>'<div class="row"><div style="min-width:0"><strong>'+esc(m.name)+'</strong><small>'+esc(m.date)+' · '+esc(m.category)+' · '+groupName(m.group||'personal')+'</small></div><div style="text-align:right;white-space:nowrap"><b class="'+(m.kind==='Ingreso'?'amount-in':m.kind==='Gasto'?'amount-out':'')+'">'+(m.kind==='Gasto'?'−':m.kind==='Ingreso'?'+':'⇄')+eur(m.amount)+'</b><br><button class="smallbtn danger" data-delete-move="'+m.id+'">Borrar</button></div></div>').join('')||'<div class="empty">No hay movimientos en esta cuenta.</div>'}
function wireHistory(){document.querySelectorAll('[data-delete-move]').forEach(b=>b.onclick=()=>{const m=data.moves.find(x=>x.id===Number(b.dataset.deleteMove));if(!m||!confirm('¿Borrar este movimiento? El saldo de la cuenta no se modificará automáticamente.'))return;data.moves=data.moves.filter(x=>x.id!==m.id);save();render()})}
document.addEventListener('click',e=>{if(e.target.closest('[data-goto-subscriptions]')){tab='moves';render();document.getElementById('subForm')?.scrollIntoView({behavior:'smooth',block:'center'})}});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
processDueSubscriptions();
save();render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=7').catch(()=>{});
</script>
</body></html>
