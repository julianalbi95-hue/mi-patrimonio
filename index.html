<head>

<style>
:root{--green:#173c34;--mint:#dcefe7;--bg:#f4f6f5;--card:#fff;--ink:#17211e;--muted:#68756f;--red:#b44343;--line:#e5eae7;--blue:#4787bd;--orange:#d69a43;--purple:#9274bb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
header{background:var(--green);color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:5}.top{display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}header small{opacity:.75}
main{max-width:760px;margin:auto;padding:16px}.panel{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #14271c0a}.hero{background:var(--green);color:white}.hero small{opacity:.75}.big{font-size:30px;font-weight:750;margin:7px 0}.muted{color:var(--muted)}.hero .muted{color:#d2e0da}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7f9f8;border-radius:13px;padding:12px}.metric b{display:block;font-size:19px;margin-top:5px}
h2{font-size:18px;margin:4px 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row strong{display:block}.row small{color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{border:0;background:none;color:var(--muted);font-size:11px;padding:5px 7px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button.active{color:var(--green);font-weight:700}nav span{font-size:19px}
button,.btn{border:0;border-radius:12px;background:var(--green);color:white;padding:12px 14px;font-weight:650;font-size:14px;cursor:pointer}.secondary{background:var(--mint);color:var(--green)}.danger{background:#fae8e8;color:var(--red)}.smallbtn{padding:7px 10px;font-size:12px}
input,select{width:100%;padding:12px;border:1px solid #d8e0dc;border-radius:11px;background:white;font:inherit;color:var(--ink);margin:5px 0 12px}label{font-size:13px;font-weight:650;color:#46534d}form{margin-top:10px}
.tag{font-size:11px;border-radius:20px;background:#edf3f0;padding:4px 8px;color:var(--green)}.amount-in{color:#16804f}.amount-out{color:var(--red)}.empty{text-align:center;padding:24px;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.45}.hidden{display:none!important}
.actionrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.actionrow button{padding:15px 10px;font-size:14px}.modalback{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modalcard{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px;padding:18px;box-shadow:0 10px 40px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.modalhead h2{margin:0}.modalclose{background:#edf3f0;color:var(--green);padding:7px 11px}.modalcard form{margin-top:16px}.modalcard button[type=submit]{width:100%}
.bar{height:10px;background:#e8eeeb;border-radius:99px;overflow:hidden;flex:1}.bar i{display:block;height:100%;border-radius:99px}.statline{display:flex;align-items:center;gap:9px;margin:12px 0}.statline .name{width:105px;font-size:13px;overflow-wrap:anywhere}.statline .value{width:82px;text-align:right;font-size:13px;font-weight:650}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}.pillactive{background:var(--green);color:#fff}.pillidle{background:var(--mint);color:var(--green)}

.chart-card{margin-top:14px}.chart-subtitle{font-size:12px;color:var(--muted);margin:-5px 0 14px}.chart-bars{height:142px;display:flex;align-items:flex-end;justify-content:space-around;gap:8px;padding:8px 2px 0;border-bottom:1px solid var(--line)}.chart-month{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}.chart-pair{height:112px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}.chart-bar{width:min(34%,18px);min-height:2px;border-radius:5px 5px 0 0}.chart-bar.income{background:#26966b}.chart-bar.expense{background:#d76b6b}.chart-month small{font-size:10px;color:var(--muted)}.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut{width:142px;height:142px;flex:0 0 142px;border-radius:50%;position:relative}.donut:after{content:'';position:absolute;inset:27px;background:white;border-radius:50%}.donut-center{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}.donut-center strong{font-size:15px;color:var(--ink)}.donut-legend{flex:1;min-width:140px}.donut-legend .row{padding:7px 0;font-size:12px}.donut-legend .row strong{font-size:12px}

/* Editor visual de distribución */
.layout-editor-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin:0 0 12px;background:#edf5f0;border:1px dashed #8ab5a0;border-radius:13px}.layout-editor-toolbar p{flex:1;min-width:170px;margin:0;font-size:12px;color:var(--muted)}.layout-editing .layout-block{outline:2px dashed #8ab5a0;outline-offset:3px;cursor:grab;position:relative}.layout-editing .layout-block:active{cursor:grabbing}.layout-block.dragging{opacity:.45}
</style>

<body>
<header><div class="top"><div><h1>Mi Patrimonio</h1><small>Tu centro de control financiero</small></div><div style="display:flex;align-items:center;gap:10px"><small id="syncStatus" style="font-size:11px"></small><button id="settingsBtn" class="smallbtn secondary hidden" type="button" aria-label="Configuración" title="Configuración">⚙️</button><button id="logoutBtn" class="smallbtn secondary hidden" type="button">Salir</button>💶</div></div></header>
<main id="app"></main>
<nav>
<button data-tab="home" class="active"><span>⌂</span>Inicio</button>
<button data-tab="moves"><span>↕</span>Movimientos</button>
<button data-tab="expiries"><span>◷</span>Vencimientos</button>
<button data-tab="stats"><span>▥</span>Análisis</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY='miPatrimonio_v1';
const initial={accounts:[
{id:1,name:'Trade Republic · Ahorro',type:'Ahorro',group:'personal',balance:7800},
{id:2,name:'Revolut · Cuenta conjunta',type:'Ahorro',group:'conjunta',balance:1800},
{id:3,name:'imaginBank · Personal',type:'Cuenta',group:'personal',balance:0},
{id:4,name:'imaginBank · Casa',type:'Cuenta',group:'conjunta',balance:0},
{id:5,name:'Fondo S&P 500',type:'Inversión',group:'personal',balance:2580},
{id:6,name:'Criptomonedas',type:'Inversión',group:'personal',balance:0}],
moves:[],expiries:[],subscriptions:[],goals:[{id:1,name:'Colchón de seguridad',target:20000,current:0}],budgets:[],incomeTarget:3670};
function migrate(raw){
const d=raw&&typeof raw==='object'?raw:structuredClone(initial);
d.accounts=Array.isArray(d.accounts)?d.accounts:[];
d.moves=Array.isArray(d.moves)?d.moves:[];
d.goals=Array.isArray(d.goals)?d.goals:[];
d.expiries=Array.isArray(d.expiries)?d.expiries:[];
d.subscriptions=Array.isArray(d.subscriptions)?d.subscriptions:[];
d.layoutOrder=d.layoutOrder&&typeof d.layoutOrder==='object'?d.layoutOrder:{};
d.accounts.forEach(a=>{if(!a.group)a.group=/conjunta|casa|revolut/i.test(a.name)?'conjunta':'personal'});
d.moves.forEach(m=>{
if(!m.group){const a=d.accounts.find(x=>x.id===m.account);m.group=a?.group||'personal'}
if(!m.date)m.date=new Date().toLocaleDateString('es-ES');
if(!m.month){const p=m.date.split('/');m.month=p.length===3?p[2]+'-'+p[1].padStart(2,'0'):new Date().toISOString().slice(0,7)}
});
return d;
}
let data;try{data=migrate(JSON.parse(localStorage.getItem(KEY))||structuredClone(initial))}catch{data=structuredClone(initial)}
let tab='home',statsGroup='all',movesFilter='all',movesSearchOpen=false,movesSearchTerm='',selectedMovesMonth=new Date().toISOString().slice(0,7),movesMonthDetail=null,layoutEditing=false;
const eur=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
let supabaseClient=null, authSession=null, cloudReady=false, cloudSaveTimer=null;
const SUPABASE_URL='https://ulheujreaunsahulnxeb.supabase.co';
const SUPABASE_KEY='sb_publishable_H1O0sr2bstyoFTcM6XAcQA_EYW5lE31';
const save=()=>{
 localStorage.setItem(KEY,JSON.stringify(data));
 if(authSession&&cloudReady){
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(async()=>{
   try{
    const {error}=await supabaseClient.from('app_data').upsert({user_id:authSession.user.id,data,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error) throw error;
    const s=document.getElementById('syncStatus');if(s)s.textContent='Sincronizado';
   }catch(err){console.error('Error al sincronizar:',err);const s=document.getElementById('syncStatus');if(s)s.textContent='Error al sincronizar';}
  },700);
 }
};
const total=()=>data.accounts.reduce((s,a)=>s+Number(a.balance||0),0);
const groupTotal=g=>data.accounts.filter(a=>a.group===g).reduce((s,a)=>s+Number(a.balance||0),0);
const sumType=t=>data.accounts.filter(a=>a.type===t).reduce((s,a)=>s+Number(a.balance||0),0);
const currentMonth=()=>new Date().toISOString().slice(0,7);
const monthMoves=(g='all',month=currentMonth())=>data.moves.filter(m=>m.month===month&&(g==='all'||(m.group||'personal')===g));
const sums=(g='all',month=currentMonth())=>{let ms=monthMoves(g,month);return {in:ms.filter(m=>m.kind==='Ingreso').reduce((s,m)=>s+Number(m.amount),0),out:ms.filter(m=>m.kind==='Gasto').reduce((s,m)=>s+Number(m.amount),0)}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groupName=g=>g==='conjunta'?'Conjunta':'Personal';
function goalMarkup(g){if(!g)return 'Aún no tienes objetivos.';return '<strong>'+esc(g.name)+'</strong><div class="big" style="font-size:24px">'+eur(g.current)+' / '+eur(g.target)+'</div><div class="bar"><i style="width:'+Math.min(100,g.current/Math.max(1,g.target)*100)+'%;background:#26966b"></i></div>'}
function localISO(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function addOneMonth(date){const [y,m,day]=date.split('-').map(Number);const nextMonth=m===12?1:m+1,nextYear=m===12?y+1:y;const lastDay=new Date(nextYear,nextMonth,0).getDate();return nextYear+'-'+String(nextMonth).padStart(2,'0')+'-'+String(Math.min(day,lastDay)).padStart(2,'0')}
function processDueSubscriptions(){
const today=localISO();let changed=false;
data.subscriptions.filter(s=>s.active!==false).forEach(s=>{
if(!s.nextDate||!s.account)return;
let guard=0;
while(s.nextDate<=today&&guard++<120){
const a=data.accounts.find(x=>x.id===Number(s.account));if(!a)break;
const date=s.nextDate,amount=Number(s.amount)||0,month=date.slice(0,7);
a.balance=Number(a.balance||0)-amount;
data.moves.push({id:Date.now()+data.moves.length,name:s.name,amount,kind:'Gasto',category:s.category||'Suscripciones',account:a.id,group:a.group||'personal',date:new Date(date+'T12:00:00').toLocaleDateString('es-ES'),month,subscriptionId:s.id});
s.nextDate=addOneMonth(s.nextDate);changed=true;
}
});
if(changed)save();
}
function categoryStats(moves){
const map={};moves.filter(m=>m.kind==='Gasto').forEach(m=>map[m.category]=(map[m.category]||0)+Number(m.amount));
return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

function homeChartsMarkup(){
 const months=[];const cursor=new Date();cursor.setDate(1);
 for(let i=5;i>=0;i--){const d=new Date(cursor.getFullYear(),cursor.getMonth()-i,1);months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}
 const monthData=months.map(month=>{const v=sums('all',month);return {month,income:v.in,expense:v.out};});
 const maxValue=Math.max(1,...monthData.flatMap(x=>[x.income,x.expense]));
 const monthBars=monthData.map(x=>{const label=new Date(Number(x.month.slice(0,4)),Number(x.month.slice(5,7))-1,1).toLocaleDateString('es-ES',{month:'short'}).replace('.','');return '<div class="chart-month"><div class="chart-pair"><i class="chart-bar income" title="Ingresos: '+eur(x.income)+'" style="height:'+Math.max(x.income?3:0,x.income/maxValue*100)+'%"></i><i class="chart-bar expense" title="Gastos: '+eur(x.expense)+'" style="height:'+Math.max(x.expense?3:0,x.expense/maxValue*100)+'%"></i></div><small>'+label+'</small></div>'}).join('');
 const palette=['#26966b','#4787bd','#9274bb','#d69a43','#d76b6b','#269ca5','#8a9b45','#b47b9d','#6d7c91','#c18b55'];
 const accounts=data.accounts.map((a,i)=>({name:a.name,value:Number(a.balance)||0,slice:Math.max(0,Number(a.balance)||0),color:palette[i%palette.length]}));
 const totalValue=accounts.reduce((n,a)=>n+a.slice,0);
 let offset=0;const stops=accounts.map(a=>{const begin=offset;offset+=totalValue?a.slice/totalValue*100:0;return a.color+' '+begin+'% '+offset+'%'}).join(',');
 const donut=totalValue?'<div class="donut" style="background:conic-gradient('+stops+')"><div class="donut-center"><strong>'+eur(totalValue)+'</strong><span>Patrimonio</span></div></div>':'<div class="empty" style="padding:20px">Añade saldos positivos a tus cuentas para ver el gráfico.</div>';
 const legend=accounts.map(a=>'<div class="row"><div style="min-width:0;display:flex;align-items:center;gap:6px"><i class="legend-dot" style="background:'+a.color+';flex:0 0 9px"></i><span style="overflow-wrap:anywhere">'+esc(a.name)+'</span></div><strong style="white-space:nowrap">'+eur(a.value)+'</strong></div>').join('');
 return '<section class="panel chart-card"><h2>Distribución de mi patrimonio</h2><p class="chart-subtitle">Cada porción representa una de las cuentas que tienes guardadas en Ajustes.</p><div class="donut-wrap">'+donut+'<div class="donut-legend">'+(legend||'<div class="empty">Todavía no tienes cuentas.</div>')+'</div></div></section><section class="panel chart-card"><h2>Ingresos y gastos</h2><p class="chart-subtitle">Comparativa de los últimos seis meses, según los movimientos registrados.</p><div class="chart-bars">'+monthBars+'</div><div class="chart-legend"><span><i class="legend-dot" style="background:#26966b"></i>Ingresos</span><span><i class="legend-dot" style="background:#d76b6b"></i>Gastos</span></div></section>';
}

function render(){
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
const app=document.getElementById('app');
if(tab==='home'){
const s=sums(),sp=sums('personal'),sc=sums('conjunta');
app.innerHTML='<section class="panel hero"><small>Patrimonio total</small><div class="big">'+eur(total())+'</div><div class="muted">Todo tu dinero: ahorro, cuentas e inversiones</div></section>'+
'<div class="actionrow"><button type="button" data-add-move="Gasto">＋ Añadir gasto</button><button type="button" class="secondary" data-add-move="Ingreso">＋ Añadir ingreso</button></div>'+
'<section class="panel"><h2>Mi patrimonio personal</h2><div class="big" style="font-size:26px">'+eur(groupTotal('personal'))+'</div><div class="row"><div><strong>Mi ahorro personal</strong><small>Cuentas y depósitos de ahorro</small></div><b>'+eur(data.accounts.filter(a=>a.group==='personal'&&a.type==='Ahorro').reduce((n,a)=>n+Number(a.balance||0),0))+'</b></div><div class="row"><div><strong>Mi cuenta de gastos</strong><small>Dinero disponible para gastos personales</small></div><b>'+eur(data.accounts.filter(a=>a.group==='personal'&&a.type==='Cuenta').reduce((n,a)=>n+Number(a.balance||0),0))+'</b></div><div class="row"><div><strong>Mis inversiones</strong><small>Fondos, ETF, acciones y criptomonedas</small></div><b>'+eur(data.accounts.filter(a=>a.group==='personal'&&a.type==='Inversión').reduce((n,a)=>n+Number(a.balance||0),0))+'</b></div></section>'+
'<section class="panel"><h2>Patrimonio conjunto</h2><div class="big" style="font-size:26px">'+eur(groupTotal('conjunta'))+'</div><div class="row"><div><strong>Ahorro conjunto</strong><small>Ahorro compartido</small></div><b>'+eur(data.accounts.filter(a=>a.group==='conjunta'&&a.type==='Ahorro').reduce((n,a)=>n+Number(a.balance||0),0))+'</b></div><div class="row"><div><strong>Cuenta de gastos conjunta</strong><small>Dinero disponible para gastos de casa</small></div><b>'+eur(data.accounts.filter(a=>a.group==='conjunta'&&a.type==='Cuenta').reduce((n,a)=>n+Number(a.balance||0),0))+'</b></div></section>'+
'<section class="grid"><div class="panel metric"><small class="muted">Ingresos este mes</small><b class="amount-in">'+eur(s.in)+'</b></div><div class="panel metric"><small class="muted">Gastos este mes</small><b class="amount-out">'+eur(s.out)+'</b></div></section>'+
'<section class="panel"><h2>Ahorro registrado este mes</h2><div class="big" style="font-size:25px">'+eur(s.in-s.out)+'</div><div class="row"><span>Personal</span><b>'+eur(sp.in-sp.out)+'</b></div><div class="row"><span>Conjunta</span><b>'+eur(sc.in-sc.out)+'</b></div><small class="muted">Calculado con los ingresos y gastos que registres.</small></section>'+
homeChartsMarkup()+'<section class="panel"><h2>Mis cuentas</h2>'+data.accounts.map(a=>'<div class="row"><div><strong>'+esc(a.name)+'</strong><small>'+groupName(a.group)+' · '+esc(a.type)+'</small></div><b>'+eur(a.balance)+'</b></div>').join('')+'</section>'+
'<section class="panel"><h2>Mis objetivos de ahorro</h2>'+ (data.goals.length?data.goals.map(g=>'<div style="margin:14px 0"><strong>'+esc(g.name)+'</strong><div class="big" style="font-size:24px">'+eur(g.current)+' <small class="muted" style="font-size:14px">/ '+eur(g.target)+'</small></div><div class="bar"><i style="width:'+Math.min(100,g.current/Math.max(1,g.target)*100)+'%;background:#26966b"></i></div><small class="muted">'+Math.round(Math.min(100,g.current/Math.max(1,g.target)*100))+'% completado · Faltan '+eur(Math.max(0,g.target-g.current))+'</small></div>').join(''):'<div class="empty">Todavía no tienes objetivos de ahorro.</div>')+'<div class="actionrow" style="margin-top:14px"><button type="button" id="addGoalBtn">＋ Añadir objetivo</button><button type="button" class="danger" id="deleteGoalBtn">− Eliminar objetivo</button></div></section>'+
'<div class="modalback hidden" id="addGoalModal"><section class="modalcard"><div class="modalhead"><h2>Nuevo objetivo</h2><button type="button" class="modalclose" id="closeAddGoal">✕</button></div><form id="goalForm"><label>Nombre</label><input name="name" placeholder="Ej. Viaje, coche, colchón..." required><label>Importe objetivo (€)</label><input name="target" type="number" min="1" step=".01" required><label>Dinero que ya has ahorrado para este objetivo (€)</label><input name="current" type="number" min="0" step=".01" value="0" placeholder="0"><button style="width:100%">Guardar objetivo</button></form></section></div>'+
'<div class="modalback hidden" id="deleteGoalModal"><section class="modalcard"><div class="modalhead"><h2>Eliminar objetivo</h2><button type="button" class="modalclose" id="closeDeleteGoal">✕</button></div>'+(data.goals.length?'<form id="deleteGoalForm"><label>Selecciona el objetivo que quieres eliminar</label><select name="goalId" required>'+data.goals.map(g=>'<option value="'+g.id+'">'+esc(g.name)+'</option>').join('')+'</select><button type="submit" class="danger" style="width:100%">Eliminar objetivo</button></form>':'<p class="empty">No tienes objetivos para eliminar.</p>')+'</section></div>';
}else if(tab==='moves'){
const recordedMonths=data.moves.map(m=>m.month).filter(Boolean).sort();
const oldestMonth=recordedMonths[0]||currentMonth();
const monthList=[];let monthCursor=currentMonth();
while(monthCursor>=oldestMonth){monthList.push(monthCursor);const [cy,cm]=monthCursor.split('-').map(Number);monthCursor=cm===1?String(cy-1)+'-12':String(cy)+'-'+String(cm-1).padStart(2,'0');}
if(!monthList.includes(selectedMovesMonth))selectedMovesMonth=monthList[0]||currentMonth();
const monthLabel=month=>{const [y,m]=month.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}).replace(/^./,x=>x.toUpperCase())};
const monthlyMoves=monthMoves(movesFilter,selectedMovesMonth);
const monthlyExpenses=monthlyMoves.filter(m=>m.kind==='Gasto');

 if(saved.length){const rank=new Map(saved.map((id,i)=>[id,i]));blocks.sort((a,b)=>(rank.get(a.dataset.layoutId)??9999)-(rank.get(b.dataset.layoutId)??9999));blocks.forEach(el=>app.appendChild(el));}

 bar.innerHTML=layoutEditing?'<p><strong>Modo edición:</strong> arrastra los bloques para cambiar su orden en este apartado.</p><button type="button" class="smallbtn" data-layout-save>Guardar orden</button><button type="button" class="smallbtn secondary" data-layout-cancel>Salir</button><button type="button" class="smallbtn danger" data-layout-reset>Restaurar</button>':'<button type="button" class="smallbtn secondary" data-layout-edit>Editar</button>';
 bar.style.margin='14px 0 24px';app.appendChild(bar);app.classList.toggle('layout-editing',layoutEditing);if(!layoutEditing)return;
 let dragged=null;blocks.forEach(el=>{el.draggable=true;el.addEventListener('dragstart',e=>{dragged=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'});el.addEventListener('dragend',()=>{el.classList.remove('dragging');dragged=null});el.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move'});el.addEventListener('drop',e=>{e.preventDefault();if(!dragged||dragged===el)return;const rect=el.getBoundingClientRect(),after=e.clientY>rect.top+rect.height/2;app.insertBefore(dragged,after?el.nextSibling:el)});});
}
function setupLayoutEditor(){
 const app=document.getElementById('app'),bar=document.getElementById('layoutEditorToolbar');if(!app||!bar)return;
 bar.querySelector('[data-layout-edit]')?.addEventListener('click',()=>{layoutEditing=true;applyLayoutEditor();setupLayoutEditor()});
 bar.querySelector('[data-layout-cancel]')?.addEventListener('click',()=>{layoutEditing=false;render()});
 bar.querySelector('[data-layout-save]')?.addEventListener('click',()=>{data.layoutOrder=data.layoutOrder||{};data.layoutOrder[tab]=[...app.querySelectorAll(':scope > .layout-block')].map(el=>el.dataset.layoutId);save();layoutEditing=false;render()});
 bar.querySelector('[data-layout-reset]')?.addEventListener('click',()=>{if(!confirm('¿Restaurar el orden original de este apartado?'))return;if(data.layoutOrder)delete data.layoutOrder[tab];save();layoutEditing=false;render()});
}

function historyMarkup(filter,term=''){
const norm=v=>String(v??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[\u200B-\u200D\uFEFF]/g,'').toLowerCase().replace(/[\s\u00A0]+/g,'');
const q=norm(term);
const list=data.moves.slice().reverse().filter(m=>{
 if(filter!=='all'&&(m.group||'personal')!==filter)return false;
 if(!q)return true;
 const account=data.accounts.find(a=>Number(a.id)===Number(m.account));
 const haystack=[m.name,m.category,m.date,m.kind,groupName(m.group||'personal'),account?.name||'Cuenta eliminada',m.amount].map(norm).join(' ');
 return haystack.includes(q);
});
return list.map(m=>{
 const account=data.accounts.find(a=>Number(a.id)===Number(m.account));
 return '<div class="row"><div style="min-width:0"><strong>'+esc(m.name)+'</strong><small>'+esc(m.date)+' · '+esc(m.category)+' · '+groupName(m.group||'personal')+' · '+esc(account?.name||'Cuenta eliminada')+'</small></div><div style="text-align:right;white-space:nowrap"><b class="'+(m.kind==='Ingreso'?'amount-in':m.kind==='Gasto'?'amount-out':'')+'">'+(m.kind==='Gasto'?'−':m.kind==='Ingreso'?'+':'⇄')+eur(m.amount)+'</b><br><button class="smallbtn danger" data-delete-move="'+m.id+'">Borrar</button></div></div>';
}).join('')||'<div class="empty">'+(q?'No se han encontrado movimientos.':'No hay movimientos en esta cuenta.')+'</div>';
}
function wireHistory(){document.querySelectorAll('[data-delete-move]').forEach(b=>b.onclick=()=>{const m=data.moves.find(x=>x.id===Number(b.dataset.deleteMove));if(!m||!confirm('¿Borrar este movimiento? El saldo de la cuenta no se modificará automáticamente.'))return;data.moves=data.moves.filter(x=>x.id!==m.id);save();render()})}
function openMovementModal(kind){
const accounts=data.accounts;
const modal=document.createElement('div');modal.className='modalback';modal.id='movementModal';
const categories=['Alimentación','Vivienda','Transporte','Ocio','Restaurantes','Compras','Suministros','Salud','Suscripciones','Viajes','Nómina','Ahorro','Inversiones','Otros'];
modal.innerHTML='<section class="modalcard"><div class="modalhead"><h2>Añadir '+(kind==='Gasto'?'gasto':'ingreso')+'</h2><button type="button" class="modalclose" data-close-modal>✕</button></div><form id="quickMoveForm"><label>Concepto</label><input name="name" placeholder="'+(kind==='Gasto'?'Ej. Compra supermercado':'Ej. Nómina')+'" required><label>Importe (€)</label><input name="amount" type="number" min="0.01" step="0.01" required><label>Categoría</label><select name="category">'+categories.map(x=>'<option>'+x+'</option>').join('')+'</select>'+(kind==='Gasto'?'<label>Tipo de gasto</label><select name="expenseType" id="expenseType"><option value="single">Gasto puntual</option><option value="subscription">Suscripción mensual</option></select><div id="subscriptionDateWrap" class="hidden"><label>Próximo cobro / primer cobro</label><input name="nextDate" type="date" value="'+localISO()+'"></div>':'')+'<label>Cuenta</label><select name="account">'+accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+' · '+groupName(a.group)+'</option>').join('')+'</select><label>Fecha</label><input name="date" type="date" value="'+localISO()+'" required><button type="submit">Guardar '+(kind==='Gasto'?'gasto':'ingreso')+'</button></form></section>';
document.body.appendChild(modal);
modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close-modal]'))modal.remove()});
const type=document.getElementById('expenseType');
if(type)type.addEventListener('change',()=>document.getElementById('subscriptionDateWrap').classList.toggle('hidden',type.value!=='subscription'));
document.getElementById('quickMoveForm').onsubmit=e=>{
e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount')),account=accounts.find(a=>a.id===Number(f.get('account')));
if(!account||!Number.isFinite(amount)||amount<=0)return;
if(kind==='Gasto'&&f.get('expenseType')==='subscription'){
const nextDate=f.get('nextDate');if(!nextDate)return alert('Indica la fecha del próximo cobro.');
data.subscriptions.push({id:Date.now(),name:f.get('name').trim(),amount,category:f.get('category'),account:account.id,nextDate,active:true});
processDueSubscriptions();
}else{
if(kind==='Gasto')account.balance=Number(account.balance||0)-amount;else account.balance=Number(account.balance||0)+amount;
const date=f.get('date');
data.moves.push({id:Date.now(),name:f.get('name').trim(),amount,kind,category:f.get('category'),account:account.id,group:account.group||'personal',date:new Date(date+'T12:00:00').toLocaleDateString('es-ES'),month:date.slice(0,7)});
}
save();modal.remove();render();
};
}

document.addEventListener('click',e=>{const add=e.target.closest('[data-add-move]');if(add)openMovementModal(add.dataset.addMove)});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
document.addEventListener('click',e=>{
 const add=e.target.closest('#addGoalBtn'),del=e.target.closest('#deleteGoalBtn');
 const closeAdd=e.target.closest('#closeAddGoal'),closeDelete=e.target.closest('#closeDeleteGoal');
 if(add){document.getElementById('addGoalModal')?.classList.remove('hidden');return}
 if(del){document.getElementById('deleteGoalModal')?.classList.remove('hidden');return}
 if(closeAdd){document.getElementById('addGoalModal')?.classList.add('hidden');return}
 if(closeDelete){document.getElementById('deleteGoalModal')?.classList.add('hidden');return}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='goalForm'){
  e.preventDefault();const f=new FormData(e.target);
  const name=String(f.get('name')||'').trim(),target=Number(f.get('target')),current=Number(f.get('current')||0);
  if(!name||!Number.isFinite(target)||target<=0||!Number.isFinite(current)||current<0){alert('Revisa el nombre y los importes del objetivo.');return}
  data.goals.push({id:Date.now(),name,target,current});save();render();return;
 }
 if(e.target.id==='deleteGoalForm'){
  e.preventDefault();const id=Number(new FormData(e.target).get('goalId')),goal=data.goals.find(g=>Number(g.id)===id);
  if(!goal)return;if(!confirm('¿Seguro que quieres eliminar el objetivo «'+goal.name+'»?'))return;
  data.goals=data.goals.filter(g=>Number(g.id)!==id);save();render();
 }
});
function showLogin(message=''){
 document.querySelector('nav').classList.add('hidden');
 document.getElementById('logoutBtn')?.classList.add('hidden');
  document.getElementById('settingsBtn')?.classList.add('hidden');
 document.getElementById('app').innerHTML='<section class="panel" style="max-width:420px;margin:30px auto"><h2>Entrar en Mi Patrimonio</h2><p class="note">Accede con el correo y la contraseña que has creado en Supabase.</p><form id="loginForm"><label>Correo electrónico</label><input name="email" type="email" autocomplete="username" required placeholder="tu correo"><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña"><button id="loginBtn" style="width:100%">Iniciar sesión</button><p id="loginMessage" class="note" style="margin-top:12px">'+esc(message)+'</p></form></section>';
 document.getElementById('loginForm').onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target),btn=document.getElementById('loginBtn'),msg=document.getElementById('loginMessage');btn.disabled=true;btn.textContent='Entrando...';msg.textContent='';
  const {error}=await supabaseClient.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});
  if(error){msg.textContent='No se ha podido iniciar sesión: '+error.message;btn.disabled=false;btn.textContent='Iniciar sesión';}
 };
}
async function loadUserData(session){
 authSession=session;cloudReady=false;
 const status=document.getElementById('syncStatus');if(status)status.textContent='Cargando datos...';
 const {data:row,error}=await supabaseClient.from('app_data').select('data').eq('user_id',session.user.id).maybeSingle();
 if(error){showLogin('No se han podido cargar tus datos: '+error.message);return;}
 if(row&&row.data){data=migrate(row.data);localStorage.setItem(KEY,JSON.stringify(data));}
 else{
  // Primera conexión: conservar y subir los datos que ya están guardados en este ordenador.
  const {error:insertError}=await supabaseClient.from('app_data').upsert({user_id:session.user.id,data,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(insertError){showLogin('No se ha podido guardar la primera copia: '+insertError.message);return;}
 }
 cloudReady=true;
 document.querySelector('nav').classList.remove('hidden');
 document.getElementById('logoutBtn')?.classList.remove('hidden');
  document.getElementById('settingsBtn')?.classList.remove('hidden');
 if(status)status.textContent='Sincronizado';
 processDueSubscriptions();save();render();
}
async function startApp(){
 if(!window.supabase){showLogin('No se ha podido cargar el servicio de acceso. Comprueba tu conexión a internet y vuelve a cargar la página.');return;}
 supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const {data:{session},error}=await supabaseClient.auth.getSession();
 if(error){showLogin('Error al comprobar la sesión: '+error.message);return;}
 if(session)await loadUserData(session);else showLogin();
 supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_IN'&&session)loadUserData(session);
  if(event==='SIGNED_OUT'){authSession=null;cloudReady=false;showLogin('Has cerrado sesión.');}
 });
}
document.getElementById('settingsBtn')?.addEventListener('click',()=>{tab='settings';render();});
document.getElementById('logoutBtn')?.addEventListener('click',()=>supabaseClient?.auth.signOut());
startApp();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=16').catch(()=>{});
</script>
