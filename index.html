<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY='miPatrimonio_v1';
const initial={accounts:[
{id:1,name:'Trade Republic · Ahorro',type:'Ahorro',group:'personal',balance:7800},
{id:2,name:'Revolut · Cuenta conjunta',type:'Ahorro',group:'conjunta',balance:1800},
{id:3,name:'imaginBank · Personal',type:'Cuenta',group:'personal',balance:0},
{id:4,name:'imaginBank · Casa',type:'Cuenta',group:'conjunta',balance:0},
{id:5,name:'Fondo S&P 500',type:'Inversión',group:'personal',balance:2580},
{id:6,name:'Criptomonedas',type:'Inversión',group:'personal',balance:0}],
moves:[],expiries:[],subscriptions:[],goals:[{id:1,name:'Colchón de seguridad',target:20000,current:0}],budgets:[],incomeTarget:3670};
function migrate(raw){
const d=raw&&typeof raw==='object'?raw:structuredClone(initial);
d.accounts=Array.isArray(d.accounts)?d.accounts:[];
d.moves=Array.isArray(d.moves)?d.moves:[];
d.goals=Array.isArray(d.goals)?d.goals:[];
d.expiries=Array.isArray(d.expiries)?d.expiries:[];
d.subscriptions=Array.isArray(d.subscriptions)?d.subscriptions:[];
d.patrimonyHistory=Array.isArray(d.patrimonyHistory)?d.patrimonyHistory:[];
d.layoutOrder=d.layoutOrder&&typeof d.layoutOrder==='object'?d.layoutOrder:{};
d.layoutHidden=d.layoutHidden&&typeof d.layoutHidden==='object'?d.layoutHidden:{};
d.customBlocks=d.customBlocks&&typeof d.customBlocks==='object'?d.customBlocks:{};
if(!d.investmentMigrationV1){
 const old=d.accounts.filter(a=>a.type==='Inversión');
 if(old.length){
  const existing=old.find(a=>Array.isArray(a.assets));
  const assets=existing?existing.assets.slice():old.map(a=>({id:'asset-'+a.id,name:a.name,value:Number(a.balance)||0,quantity:'',ticker:''}));
  const balance=old.reduce((n,a)=>n+(Number(a.balance)||0),0),first=existing||old[0];
  d.accounts=d.accounts.filter(a=>a.type!=='Inversión');
  d.accounts.push({id:first.id,name:'Inversiones',type:'Inversión',group:first.group||'personal',balance,assets});
 }
 d.investmentMigrationV1=true;
}
d.accounts.forEach(a=>{if(!a.group)a.group=/conjunta|casa|revolut/i.test(a.name)?'conjunta':'personal'});
d.moves.forEach(m=>{
if(!m.group){const a=d.accounts.find(x=>x.id===m.account);m.group=a?.group||'personal'}
if(!m.date)m.date=new Date().toLocaleDateString('es-ES');
if(!m.month){const p=m.date.split('/');m.month=p.length===3?p[2]+'-'+p[1].padStart(2,'0'):new Date().toISOString().slice(0,7)}
});
return d;
}
let data;try{data=migrate(JSON.parse(localStorage.getItem(KEY))||structuredClone(initial))}catch{data=structuredClone(initial)}
let tab='home',statsGroup='all',movesFilter='all',movesSearchOpen=false,movesSearchTerm='',movesHistoryExpanded=false,selectedMovesMonth=new Date().toISOString().slice(0,7),movesMonthDetail=null,layoutEditing=false,analysisCalendarDate=localISO();
const eur=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
let supabaseClient=null, authSession=null, cloudReady=false, cloudSaveTimer=null;
const SUPABASE_URL='https://ulheujreaunsahulnxeb.supabase.co';
const SUPABASE_KEY='sb_publishable_H1O0sr2bstyoFTcM6XAcQA_EYW5lE31';
const save=()=>{
 localStorage.setItem(KEY,JSON.stringify(data));
 if(authSession&&cloudReady){
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(async()=>{
   try{
    const {error}=await supabaseClient.from('app_data').upsert({user_id:authSession.user.id,data,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error) throw error;
    const s=document.getElementById('syncStatus');if(s)s.textContent='Sincronizado';
   }catch(err){console.error('Error al sincronizar:',err);const s=document.getElementById('syncStatus');if(s)s.textContent='Error al sincronizar';}
  },700);
 }
};
const total=()=>data.accounts.reduce((s,a)=>s+Number(a.balance||0),0);
const groupTotal=g=>data.accounts.filter(a=>a.group===g).reduce((s,a)=>s+Number(a.balance||0),0);
const sumType=t=>data.accounts.filter(a=>a.type===t).reduce((s,a)=>s+Number(a.balance||0),0);
const currentMonth=()=>new Date().toISOString().slice(0,7);
const monthMoves=(g='all',month=currentMonth())=>data.moves.filter(m=>m.month===month&&(g==='all'||(m.group||'personal')===g));
const sums=(g='all',month=currentMonth())=>{let ms=monthMoves(g,month);return {in:ms.filter(m=>m.kind==='Ingreso').reduce((s,m)=>s+Number(m.amount),0),out:ms.filter(m=>m.kind==='Gasto').reduce((s,m)=>s+Number(m.amount),0)}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groupName=g=>g==='conjunta'?'Conjunta':'Personal';
function goalMarkup(g){if(!g)return 'Aún no tienes objetivos.';return '<strong>'+esc(g.name)+'</strong><div class="big" style="font-size:24px">'+eur(g.current)+' / '+eur(g.target)+'</div><div class="bar"><i style="width:'+Math.min(100,g.current/Math.max(1,g.target)*100)+'%;background:#26966b"></i></div>'}
function localISO(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function addOneMonth(date){const [y,m,day]=date.split('-').map(Number);const nextMonth=m===12?1:m+1,nextYear=m===12?y+1:y;const lastDay=new Date(nextYear,nextMonth,0).getDate();return nextYear+'-'+String(nextMonth).padStart(2,'0')+'-'+String(Math.min(day,lastDay)).padStart(2,'0')}
function processDueSubscriptions(){
const today=localISO();let changed=false;
data.subscriptions.filter(s=>s.active!==false).forEach(s=>{
if(!s.nextDate||!s.account)return;
let guard=0;
while(s.nextDate<=today&&guard++<120){
const a=data.accounts.find(x=>x.id===Number(s.account));if(!a)break;
const date=s.nextDate,amount=Number(s.amount)||0,month=date.slice(0,7);
a.balance=Number(a.balance||0)-amount;
data.moves.push({id:Date.now()+data.moves.length,name:s.name,amount,kind:'Gasto',category:s.category||'Suscripciones',account:a.id,group:a.group||'personal',date:new Date(date+'T12:00:00').toLocaleDateString('es-ES'),month,subscriptionId:s.id,createdAt:Date.now()});
s.nextDate=addOneMonth(s.nextDate);changed=true;
}
});
if(changed)save();
}
function categoryStats(moves){
const map={};moves.filter(m=>m.kind==='Gasto').forEach(m=>map[m.category]=(map[m.category]||0)+Number(m.amount));
return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

function walletMarkup(){
 const account=data.accounts.find(a=>a.group==='personal'&&a.type==='Cuenta'&&/imaginbank/i.test(a.name||''));
 if(!account)return '<section class="panel"><h2>👛 Mi monedero personal</h2><p class="note">No encuentro la cuenta «imaginBank · Personal». Comprueba que siga existiendo en Ajustes y que esté configurada como cuenta personal.</p></section>';
 const balance=Number(account.balance)||0,month=currentMonth();
 let tracker=data.walletTracker;
 if(!tracker||tracker.month!==month||Number(tracker.accountId)!==Number(account.id)||tracker.baselineMode!=='month-start-v1'||!Number.isFinite(Number(tracker.initialBalance))){
  const monthNet=data.moves.filter(m=>m.month===month&&Number(m.account)===Number(account.id)).reduce((total,m)=>total+(m.kind==='Ingreso'?1:m.kind==='Gasto'?-1:0)*Number(m.amount||0),0);
  const monthStartBalance=balance-monthNet;
  tracker={accountId:account.id,month,initialBalance:monthStartBalance,startedAt:Date.now(),baselineMode:'month-start-v1'};
  data.walletTracker=tracker;save();
 }
 const initial=Number(tracker.initialBalance)||0;
 const percent=initial>0?Math.max(0,Math.min(100,balance/initial*100)):0;
 const change=initial-balance;
 const changeLabel=change>=0?'Disminución desde el saldo del día 1':'Aumento desde el saldo del día 1';
 return '<section class="panel"><h2>👛 Mi monedero personal</h2><p class="chart-subtitle">Tu dinero disponible en imaginBank · Personal.</p><div style="display:flex;justify-content:space-between;align-items:end;gap:8px;margin-top:14px"><div><small class="muted">Te queda</small><div class="big" style="font-size:30px;color:'+(balance<0?'#d76b6b':'var(--green)')+'">'+eur(balance)+'</div></div><div style="text-align:right"><small class="muted">Saldo el día 1</small><strong style="display:block">'+eur(initial)+'</strong></div></div><div style="height:16px;background:var(--line);border-radius:20px;overflow:hidden;margin:12px 0 7px"><div style="height:100%;width:'+percent+'%;background:'+(percent<20?'#d76b6b':'#26966b')+';border-radius:20px;transition:width .25s"></div></div><div class="row"><small class="muted">'+changeLabel+': '+eur(Math.abs(change))+'</small><small class="muted">'+percent.toFixed(1).replace('.',',')+' % disponible</small></div><div class="note" style="margin-top:10px">La barra toma como referencia el saldo que tenías el día 1 del mes, reconstruido a partir de los movimientos registrados en esta cuenta. Se actualiza automáticamente.</div></section>';
}
function investmentAccount(){return data.accounts.find(a=>a.type==='Inversión')}
function investmentAssets(){const a=investmentAccount();return Array.isArray(a?.assets)?a.assets:[]}
async function refreshInvestmentPrices(){
 if(!authSession||!cloudReady)return false;
 const supported=new Set(['US02079K1079','LU1681048804','US67066G1040','US8740541094','US35834F1049']);
 const assets=investmentAssets().filter(x=>supported.has(String(x.ticker||'').trim().toUpperCase()));
 if(!assets.length)return false;
 try{
  const response=await fetch('./prices.json?refresh='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('No se ha podido leer el fichero de cotizaciones.');
  const feed=await response.json(),fx=Number(feed.eurUsd);
  let changed=false;
  assets.forEach(x=>{
   const isin=String(x.ticker||'').trim().toUpperCase(),quote=feed.assets?.[isin];
   if(!quote)return;
   const quantity=Number(x.quantity),price=Number(quote.price),currency=String(quote.currency||'').toUpperCase();
   if(!Number.isFinite(quantity)||quantity<=0||!Number.isFinite(price)||price<=0)return;
   let value=quantity*price;
   if(currency==='USD'){if(!Number.isFinite(fx)||fx<=0)return;value=value/fx}
   else if(currency!=='EUR')return;
   value=Math.round(value*100)/100;
   if(Math.abs((Number(x.value)||0)-value)>=0.01||x.priceDate!==quote.date||x.marketPrice!==price||x.priceCurrency!==currency){
    x.value=value;x.priceDate=quote.date||null;x.marketPrice=price;x.priceCurrency=currency;changed=true;
   }
  });
  if(changed){const inv=investmentAccount();if(inv)inv.balance=investmentAssets().reduce((n,x)=>n+(Number(x.value)||0),0);save()}
  return changed;
 }catch(error){console.warn('No se pudieron actualizar las inversiones:',error);return false}
}
function investmentValue(){return investmentAssets().reduce((n,x)=>n+(Number(x.value)||0),0)}
function homeChartsMarkup(){
 const months=[];const cursor=new Date();cursor.setDate(1);
 for(let i=5;i>=0;i--){const d=new Date(cursor.getFullYear(),cursor.getMonth()-i,1);months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}
 const monthData=months.map(month=>{const v=sums('all',month);return {month,income:v.in,expense:v.out};}),maxValue=Math.max(1,...monthData.flatMap(x=>[x.income,x.expense]));
 const monthBars=monthData.map(x=>{const label=new Date(Number(x.month.slice(0,4)),Number(x.month.slice(5,7))-1,1).toLocaleDateString('es-ES',{month:'short'}).replace('.','');return '<div class="chart-month"><div class="chart-pair"><i class="chart-bar income" style="height:'+Math.max(x.income?3:0,x.income/maxValue*100)+'%"></i><i class="chart-bar expense" style="height:'+Math.max(x.expense?3:0,x.expense/maxValue*100)+'%"></i></div><small>'+label+'</small></div>'}).join('');
 const palette=['#26966b','#4787bd','#9274bb','#d69a43','#d76b6b','#269ca5','#8a9b45','#b47b9d','#6d7c91','#c18b55'],assets=investmentAssets(),invTotal=investmentValue(),accounts=[];
 data.accounts.forEach((a,i)=>{if(a.type!=='Inversión'){const v=Number(a.balance)||0;accounts.push({name:a.name,value:v,slice:Math.max(0,v),color:palette[i%palette.length]})}});
 if(invTotal)accounts.push({name:'Inversiones',value:invTotal,slice:Math.max(0,invTotal),color:palette[accounts.length%palette.length]});
 const donut=(items,label)=>{const total=items.reduce((n,x)=>n+x.slice,0);let off=0;const stops=items.map(x=>{const st=off;off+=total?x.slice/total*100:0;return x.color+' '+st+'% '+off+'%'}).join(',');const legend=items.map(x=>'<div class="row"><span style="display:flex;align-items:center;gap:7px"><i class="legend-dot" style="background:'+x.color+';flex:0 0 9px"></i>'+esc(x.name)+'</span><strong>'+((total?x.slice/total*100:0).toFixed(1).replace('.',','))+'% · '+eur(x.value)+'</strong></div>').join('');return total?'<div class="donut-wrap"><div class="donut" style="background:conic-gradient('+stops+')"><div class="donut-center"><strong>'+eur(total)+'</strong><span>'+label+'</span></div></div><div class="donut-legend">'+legend+'</div></div>':'<div class="empty">Todavía no hay inversiones registradas.</div>'};
 const invItems=assets.map((x,i)=>({name:x.name,value:Number(x.value)||0,slice:Math.max(0,Number(x.value)||0),color:palette[i%palette.length]}));

function customChartMarkup(block){
 const moves=data.moves||[],accounts=data.accounts||[],goals=data.goals||[];
 let rows=[],subtitle='',max=1;
 if(block.type==='accounts'){rows=accounts.map(a=>[a.name,Number(a.balance)||0]);subtitle='Saldo actual de cada cuenta';}
 else if(block.type==='income-expenses'){const months={};moves.forEach(m=>{const k=m.month||String(m.date||'').slice(0,7);if(!k)return;months[k]??={in:0,out:0};if(m.kind==='Ingreso')months[k].in+=Number(m.amount)||0;if(m.kind==='Gasto')months[k].out+=Number(m.amount)||0});rows=Object.keys(months).sort().slice(-6).flatMap(k=>[[k+' · Ingresos',months[k].in],[k+' · Gastos',months[k].out]]);subtitle='Ingresos y gastos registrados por mes';}
 else if(block.type==='categories'){const cats={};moves.filter(m=>m.kind==='Gasto').forEach(m=>{const k=m.category||'Sin categoría';cats[k]=(cats[k]||0)+(Number(m.amount)||0)});rows=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,8);subtitle='Distribución de los gastos por categoría';}
 else if(block.type==='goals'){rows=goals.map(g=>[g.name,Number(g.current)||0]);subtitle='Dinero ahorrado en cada objetivo';}
 else if(block.type==='groups'){rows=[['Patrimonio personal',accounts.filter(a=>a.group==='personal').reduce((n,a)=>n+(Number(a.balance)||0),0)],['Patrimonio conjunto',accounts.filter(a=>a.group==='conjunta').reduce((n,a)=>n+(Number(a.balance)||0),0)]];subtitle='Comparación del patrimonio personal y conjunto';}
 else if(block.type==='expiries'){const now=new Date();rows=(data.expiries||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6).map(e=>[e.name+' · '+e.date,1]);subtitle='Próximos documentos y vencimientos';}
 max=Math.max(1,...rows.map(x=>Math.abs(Number(x[1])||0)));
 const content=rows.length?rows.map(([name,value])=>'<div class="statline"><div class="name">'+esc(name)+'</div><div class="bar"><i style="width:'+Math.max(2,Math.abs(Number(value)||0)/max*100)+'%;background:var(--blue)"></i></div><div class="value">'+(block.type==='expiries'?'':eur(value))+'</div></div>').join(''):'<div class="empty">Todavía no hay datos para mostrar esta gráfica.</div>';
 return '<section class="panel custom-chart-block" data-custom-block-id="'+esc(block.id)+'"><h2>'+esc(block.title||'Mi gráfica')+'</h2><p class="note">'+subtitle+'</p>'+content+'</section>';
}

 if(saved.length){const rank=new Map(saved.map((id,i)=>[id,i]));blocks.sort((a,b)=>(rank.get(a.dataset.layoutId)??9999)-(rank.get(b.dataset.layoutId)??9999));blocks.forEach(el=>app.appendChild(el));}
 const bar=document.createElement('div');bar.className='layout-editor-toolbar';bar.id='layoutEditorToolbar';
 bar.innerHTML=layoutEditing?'<p><strong>Modo edición:</strong> oculta bloques o recupera los que quitaste. Mantén pulsado ☰ para moverlos.</p><select id="addChartType" aria-label="Tipo de gráfica" style="max-width:190px;margin:0"><option value="">Añadir gráfica…</option><option value="accounts">Saldos por cuenta</option><option value="income-expenses">Ingresos y gastos por mes</option><option value="categories">Gastos por categoría</option><option value="goals">Progreso de objetivos</option><option value="groups">Patrimonio personal y conjunto</option><option value="expiries">Próximos vencimientos</option></select><button type="button" class="smallbtn" data-layout-add>＋ Añadir</button><button type="button" class="smallbtn" data-layout-save>Guardar</button><button type="button" class="smallbtn secondary" data-layout-cancel>Salir</button><button type="button" class="smallbtn danger" data-layout-reset>Restaurar</button>':'<button type="button" class="smallbtn secondary" data-layout-edit>Editar</button>';
 bar.style.margin='14px 0 24px';app.appendChild(bar);app.classList.toggle('layout-editing',layoutEditing);if(!layoutEditing)return;
 let dragged=null;
 const moveBefore=(from,to,after)=>{if(!from||!to||from===to)return;app.insertBefore(from,after?to.nextSibling:to)};
 blocks.forEach(el=>{
  const controls=document.createElement('div');controls.className='layout-block-controls';
  const isHidden=hidden.has(el.dataset.layoutId);
  controls.innerHTML=isHidden?'<span class="layout-control-label">Bloque oculto</span><button type="button" class="smallbtn" data-layout-show>＋ Recuperar</button>': '<button type="button" class="layout-drag-handle" aria-label="Mantener pulsado para mover bloque" title="Mantener pulsado para mover">☰</button><span class="layout-control-label">Mover bloque</span><button type="button" class="layout-move-up" aria-label="Mover arriba">↑</button><button type="button" class="layout-move-down" aria-label="Mover abajo">↓</button><button type="button" class="smallbtn danger" data-layout-hide>Quitar</button>';
  el.appendChild(controls);
  controls.querySelector('[data-layout-hide]')?.addEventListener('click',()=>{const arr=new Set(data.layoutHidden?.[tab]||[]);arr.add(el.dataset.layoutId);data.layoutHidden=data.layoutHidden||{};data.layoutHidden[tab]=[...arr];save();applyLayoutEditor();setupLayoutEditor()});
  controls.querySelector('[data-layout-show]')?.addEventListener('click',()=>{data.layoutHidden[tab]=(data.layoutHidden[tab]||[]).filter(id=>id!==el.dataset.layoutId);save();applyLayoutEditor();setupLayoutEditor()});
  controls.querySelector('.layout-move-up')?.addEventListener('click',()=>{const prev=el.previousElementSibling;if(prev&&prev.classList.contains('layout-block'))app.insertBefore(el,prev)});
  controls.querySelector('.layout-move-down')?.addEventListener('click',()=>{const next=el.nextElementSibling;if(next&&next.classList.contains('layout-block'))app.insertBefore(next,el)});
  const handle=controls.querySelector('.layout-drag-handle');if(!handle)return;
  handle.addEventListener('pointerdown',e=>{e.preventDefault();dragged=el;el.classList.add('dragging');handle.setPointerCapture?.(e.pointerId)});
  handle.addEventListener('pointermove',e=>{if(dragged!==el)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.layout-block');if(!target||target===el||target.parentElement!==app||hidden.has(target.dataset.layoutId))return;const rect=target.getBoundingClientRect();moveBefore(el,target,e.clientY>rect.top+rect.height/2)});
  const finish=()=>{if(dragged===el){el.classList.remove('dragging');dragged=null}};
  handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);handle.addEventListener('lostpointercapture',finish);
  el.draggable=true;
  el.addEventListener('dragstart',e=>{if(e.target.closest('.layout-block-controls')){e.preventDefault();return}dragged=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
  el.addEventListener('dragend',()=>{el.classList.remove('dragging');dragged=null});
  el.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move'});
  el.addEventListener('drop',e=>{e.preventDefault();if(!dragged||dragged===el)return;const rect=el.getBoundingClientRect();moveBefore(dragged,el,e.clientY>rect.top+rect.height/2)});
 });
}
function setupLayoutEditor(){
 const app=document.getElementById('app'),bar=document.getElementById('layoutEditorToolbar');if(!app||!bar)return;
 bar.querySelector('[data-layout-edit]')?.addEventListener('click',()=>{layoutEditing=true;applyLayoutEditor();setupLayoutEditor()});
 bar.querySelector('[data-layout-cancel]')?.addEventListener('click',()=>{layoutEditing=false;render()});
 bar.querySelector('[data-layout-save]')?.addEventListener('click',()=>{data.layoutOrder=data.layoutOrder||{};data.layoutOrder[tab]=[...app.querySelectorAll(':scope > .layout-block')].map(el=>el.dataset.layoutId);save();layoutEditing=false;render()});
 bar.querySelector('[data-layout-add]')?.addEventListener('click',()=>{const sel=bar.querySelector('#addChartType'),type=sel?.value;if(!type){alert('Elige primero qué gráfica quieres añadir.');return}const names={accounts:'Saldos por cuenta', 'income-expenses':'Ingresos y gastos por mes',categories:'Gastos por categoría',goals:'Progreso de objetivos',groups:'Patrimonio personal y conjunto',expiries:'Próximos vencimientos'};data.customBlocks=data.customBlocks||{};data.customBlocks[tab]=data.customBlocks[tab]||[];data.customBlocks[tab].push({id:'chart-'+Date.now(),type,title:names[type]||'Mi gráfica'});save();render()});
 bar.querySelector('[data-layout-reset]')?.addEventListener('click',()=>{if(!confirm('¿Restaurar los bloques originales de este apartado? Se mostrarán de nuevo y se quitarán las gráficas personalizadas de esta pestaña.'))return;if(data.layoutOrder)delete data.layoutOrder[tab];if(data.layoutHidden)delete data.layoutHidden[tab];if(data.customBlocks)delete data.customBlocks[tab];save();layoutEditing=false;render()});
}

function historyMarkup(filter,term=''){
const norm=v=>String(v??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[\u200B-\u200D\uFEFF]/g,'').toLowerCase().replace(/[\s\u00A0]+/g,'');
const q=norm(term);
const list=data.moves.slice().reverse().filter(m=>{
 if(filter!=='all'&&(m.group||'personal')!==filter)return false;
 if(!q)return true;
 const account=data.accounts.find(a=>Number(a.id)===Number(m.account));
 const haystack=[m.name,m.category,m.date,m.kind,groupName(m.group||'personal'),account?.name||'Cuenta eliminada',m.amount].map(norm).join(' ');
 return haystack.includes(q);
});
const expanded=Boolean(q)||movesHistoryExpanded;
const shown=expanded?list:list.slice(0,10);
const rows=shown.map(m=>{
 const account=data.accounts.find(a=>Number(a.id)===Number(m.account));
 return '<div class="row"><div style="min-width:0"><strong>'+esc(m.name)+'</strong><small>'+esc(m.date)+' · '+esc(m.category)+' · '+groupName(m.group||'personal')+' · '+esc(account?.name||'Cuenta eliminada')+'</small></div><div style="text-align:right;white-space:nowrap"><b class="'+(m.kind==='Ingreso'?'amount-in':m.kind==='Gasto'?'amount-out':'')+'">'+(m.kind==='Gasto'?'−':m.kind==='Ingreso'?'+':'⇄')+eur(m.amount)+'</b><br><button class="smallbtn danger" data-delete-move="'+m.id+'">Borrar</button></div></div>';
}).join('');
const more=!q&&list.length>10?'<div style="text-align:center;padding-top:12px"><button type="button" class="smallbtn secondary" id="toggleMoreMoves">'+(expanded?'Ver menos':'Ver más ('+ (list.length-10) +' restantes)')+'</button></div>':'';
return (rows||'<div class="empty">'+(q?'No se han encontrado movimientos.':'No hay movimientos en esta cuenta.')+'</div>')+more;
}
function wireHistory(){
 document.querySelectorAll('[data-delete-move]').forEach(b=>b.onclick=()=>{
  const moveId=Number(b.dataset.deleteMove),moveIndex=data.moves.findIndex(x=>Number(x.id)===moveId);
  if(moveIndex<0)return;
  const m=data.moves[moveIndex],account=data.accounts.find(a=>Number(a.id)===Number(m.account)),amount=Number(m.amount);
  if((m.kind==='Gasto'||m.kind==='Ingreso')&&!account){alert('No encuentro la cuenta asociada a este movimiento. No se ha borrado ni modificado nada.');return;}
  if(!Number.isFinite(amount)||amount<0){alert('El importe de este movimiento no es válido. No se ha borrado ni modificado nada.');return;}

  if(account&&m.kind==='Gasto')account.balance=Number(account.balance||0)+amount;
  else if(account&&m.kind==='Ingreso')account.balance=Number(account.balance||0)-amount;
  data.moves.splice(moveIndex,1);
  save();render();
 });
}
function openMovementModal(kind){
const accounts=data.accounts;
const modal=document.createElement('div');modal.className='modalback';modal.id='movementModal';
const categories=['Alimentación','Vivienda','Transporte','Ocio','Restaurantes','Compras','Suministros','Salud','Suscripciones','Viajes','Nómina','Ahorro','Inversiones','Otros'];
modal.innerHTML='<section class="modalcard"><div class="modalhead"><h2>Añadir '+(kind==='Gasto'?'gasto':'ingreso')+'</h2><button type="button" class="modalclose" data-close-modal>✕</button></div><form id="quickMoveForm"><label>Concepto</label><input name="name" placeholder="'+(kind==='Gasto'?'Ej. Compra supermercado':'Ej. Nómina')+'" required><label>Importe (€)</label><input name="amount" type="number" min="0.01" step="0.01" required><label>Categoría</label><select name="category">'+categories.map(x=>'<option>'+x+'</option>').join('')+'</select>'+(kind==='Gasto'?'<label>Tipo de gasto</label><select name="expenseType" id="expenseType"><option value="single">Gasto puntual</option><option value="subscription">Suscripción mensual</option></select><div id="subscriptionDateWrap" class="hidden"><label>Próximo cobro / primer cobro</label><input name="nextDate" type="date" value="'+localISO()+'"></div>':'')+'<label>Cuenta</label><select name="account">'+accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+' · '+groupName(a.group)+'</option>').join('')+'</select><label>Fecha</label><input name="date" type="date" value="'+localISO()+'" required><button type="submit">Guardar '+(kind==='Gasto'?'gasto':'ingreso')+'</button></form></section>';
document.body.appendChild(modal);
modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close-modal]'))modal.remove()});
const type=document.getElementById('expenseType');
if(type)type.addEventListener('change',()=>document.getElementById('subscriptionDateWrap').classList.toggle('hidden',type.value!=='subscription'));
document.getElementById('quickMoveForm').onsubmit=e=>{
e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount')),account=accounts.find(a=>a.id===Number(f.get('account')));
if(!account||!Number.isFinite(amount)||amount<=0)return;
if(kind==='Gasto'&&f.get('expenseType')==='subscription'){
const nextDate=f.get('nextDate');if(!nextDate)return alert('Indica la fecha del próximo cobro.');
data.subscriptions.push({id:Date.now(),name:f.get('name').trim(),amount,category:f.get('category'),account:account.id,nextDate,active:true});
processDueSubscriptions();
}else{
if(kind==='Gasto')account.balance=Number(account.balance||0)-amount;else account.balance=Number(account.balance||0)+amount;
const date=f.get('date');
data.moves.push({id:Date.now(),name:f.get('name').trim(),amount,kind,category:f.get('category'),account:account.id,group:account.group||'personal',date:new Date(date+'T12:00:00').toLocaleDateString('es-ES'),month:date.slice(0,7),createdAt:Date.now()});
}
save();modal.remove();render();
};
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
document.addEventListener('click',e=>{
 const add=e.target.closest('#addGoalBtn'),del=e.target.closest('#deleteGoalBtn');

document.addEventListener('submit',e=>{
 if(e.target.id==='goalForm'){
  e.preventDefault();const f=new FormData(e.target);
  const name=String(f.get('name')||'').trim(),target=Number(f.get('target')),current=Number(f.get('current')||0);
  if(!name||!Number.isFinite(target)||target<=0||!Number.isFinite(current)||current<0){alert('Revisa el nombre y los importes del objetivo.');return}

 }

function showLogin(message=''){
 document.querySelector('nav').classList.add('hidden');
 document.getElementById('logoutBtn')?.classList.add('hidden');
  document.getElementById('settingsBtn')?.classList.add('hidden');
 document.getElementById('app').innerHTML='<section class="panel" style="max-width:420px;margin:30px auto"><h2>Entrar en Mi Patrimonio</h2><p class="note">Accede con el correo y la contraseña que has creado en Supabase.</p><form id="loginForm"><label>Correo electrónico</label><input name="email" type="email" autocomplete="username" required placeholder="tu correo"><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña"><button id="loginBtn" style="width:100%">Iniciar sesión</button><p id="loginMessage" class="note" style="margin-top:12px">'+esc(message)+'</p></form></section>';
 document.getElementById('loginForm').onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target),btn=document.getElementById('loginBtn'),msg=document.getElementById('loginMessage');btn.disabled=true;btn.textContent='Entrando...';msg.textContent='';
  const {error}=await supabaseClient.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});
  if(error){msg.textContent='No se ha podido iniciar sesión: '+error.message;btn.disabled=false;btn.textContent='Iniciar sesión';}
 };

async function loadUserData(session){
 authSession=session;cloudReady=false;
 const status=document.getElementById('syncStatus');if(status)status.textContent='Cargando datos...';
 const {data:row,error}=await supabaseClient.from('app_data').select('data').eq('user_id',session.user.id).maybeSingle();
 if(error){showLogin('No se han podido cargar tus datos: '+error.message);return;}
 if(row&&row.data){data=migrate(row.data);localStorage.setItem(KEY,JSON.stringify(data));}
 else{
  // Primera conexión: conservar y subir los datos que ya están guardados en este ordenador.
  const {error:insertError}=await supabaseClient.from('app_data').upsert({user_id:session.user.id,data,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(insertError){showLogin('No se ha podido guardar la primera copia: '+insertError.message);return;}
 }
 cloudReady=true;
 await refreshInvestmentPrices();
 document.querySelector('nav').classList.remove('hidden');
 document.getElementById('logoutBtn')?.classList.remove('hidden');
  document.getElementById('settingsBtn')?.classList.remove('hidden');
 if(status)status.textContent='Sincronizado';
 processDueSubscriptions();save();render();
}
async function startApp(){
 if(!window.supabase){showLogin('No se ha podido cargar el servicio de acceso. Comprueba tu conexión a internet y vuelve a cargar la página.');return;}
 supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const {data:{session},error}=await supabaseClient.auth.getSession();
 if(error){showLogin('Error al comprobar la sesión: '+error.message);return;}
 if(session)await loadUserData(session);else showLogin();
 supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_IN'&&session)loadUserData(session);
  if(event==='SIGNED_OUT'){authSession=null;cloudReady=false;showLogin('Has cerrado sesión.');}
 });
}
document.getElementById('settingsBtn')?.addEventListener('click',()=>{tab='settings';render();});
document.getElementById('logoutBtn')?.addEventListener('click',()=>supabaseClient?.auth.signOut());
startApp();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=35').catch(()=>{});
</script>
