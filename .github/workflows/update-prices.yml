name: Actualizar precios de inversiones

on:
  schedule:
    - cron: "40 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Consultar precios y cambio BCE
        run: python scripts/update_prices.py
      - name: Guardar precios actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "No hay cambios en las cotizaciones."
          else
            git commit -m "Actualiza cotizaciones diarias"
            git push
          fi
